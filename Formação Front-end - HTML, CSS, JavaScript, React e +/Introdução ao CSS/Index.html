<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <!-- 3 - Internal CSS -->
    <style>
        p {
            color: coral;
            font-size: 40px;
        }
    </style>
    <!-- 4 - External CSS -->
    <!-- CSS : Cascade Style Sheets -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- 1 - Inline CSS -->
    <h1 style="color: blue">Mudar a cor com o inline</h1>

    <!-- 2 - Multiplas regras -->
    <h1 style="color: purple; font-size: 40px; border-bottom: 1px solid red;">Mudar cor e tamanho da fonte</h1>

    <!-- 3 - Internal CSS -->
    <p>Eu fui estilizado pelo Internal</p>

    <!-- 4 - External CSS -->
    <h3>Meu título vermelho</h3>

    <!-- 5 - Ordem do CSS -->
     <p style="color: red;">Ordem do CSS</p>
     <p>Ordem do CSS 2</p>
</body>

</html>
